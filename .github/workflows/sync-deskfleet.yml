name: Sync DeskFleet release

on:
  schedule:
    # Weekdays every two hours; offset minutes to avoid top-of-hour contention.
    - cron: "17 */2 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-deskfleet
  cancel-in-progress: false

jobs:
  sync:
    name: Update DeskFleet cask
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Tap
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install locked toolchain
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.23
          cache: true

      - name: Check synchronization tools
        run: mise run check

      - name: Synchronize latest stable release
        id: release
        run: mise run sync

      # Default GITHUB_TOKEN opens the PR for maintainer review. Do not auto-merge.
      # PRs created with GITHUB_TOKEN do not start repository workflows the same way
      # a PAT or App token would; the maintainer reviews and merges manually.
      - name: Create or update release PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          base: main
          branch: dsh0416/update-deskfleet
          delete-branch: true
          add-paths: Casks/deskfleet.rb
          commit-message: "chore(cask): update DeskFleet to ${{ steps.release.outputs.version }}"
          title: "Update DeskFleet to ${{ steps.release.outputs.version }}"
          body: |
            Track the latest published stable DeskFleet release.

            Use GitHub's published Apple Silicon DMG digest for the Cask.
            Review and merge manually; this PR is not auto-merged.
