name: Sync DeskFleet release

on:
  schedule:
    # Weekdays every two hours; offset minutes to avoid top-of-hour contention.
    - cron: "17 */2 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-deskfleet
  cancel-in-progress: false

jobs:
  sync:
    name: Update DeskFleet cask
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Tap
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Require GitHub App credentials
        env:
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          missing=()
          [[ -z "$APP_CLIENT_ID" ]] && missing+=("repository variable APP_CLIENT_ID")
          [[ -z "$APP_PRIVATE_KEY" ]] && missing+=("repository secret APP_PRIVATE_KEY")
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing GitHub App credentials: ${missing[*]}. Configure the one-time App setup in agents/docs/maintenance.md. A personal TAP_SYNC_TOKEN is not used."
            exit 1
          fi

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Install locked toolchain
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.23
          cache: true

      - name: Check synchronization tools
        run: mise run check

      - name: Synchronize latest stable release
        id: release
        run: mise run sync

      # An App installation token allows PR checks to start without the approval
      # needed for PRs created with GITHUB_TOKEN. The App is installed only on
      # this Tap with Contents and Pull requests write.
      - name: Create or update release PR
        id: pull_request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: main
          branch: dsh0416/update-deskfleet
          delete-branch: true
          add-paths: Casks/deskfleet.rb
          commit-message: "chore(cask): update DeskFleet to ${{ steps.release.outputs.version }}"
          title: "Update DeskFleet to ${{ steps.release.outputs.version }}"
          body: |
            Track the latest published stable DeskFleet release.

            Use GitHub's published Apple Silicon DMG digest for the Cask.
            The Utilities check must pass before this PR can merge.

      - name: Enable auto-merge after required checks
        if: steps.pull_request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pull_request.outputs.pull-request-number }}
        run: |
          if [[ "$(gh api "repos/$GH_REPO" --jq .allow_auto_merge)" != true ]]; then
            echo "::error::Enable Allow auto-merge in the Tap repository settings."
            exit 1
          fi
          protected="$(gh api "repos/$GH_REPO/branches/main" --jq '
            .protected and ((.protection.required_status_checks.contexts // []) |
            contains(["Utilities"]))
          ')"
          if [[ "$protected" != true ]]; then
            echo "::error::Protect main with the Utilities check documented in agents/docs/maintenance.md."
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --auto --squash
